<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./coffee.png" />

    <title>hunixcode — full-stack developer</title>
    <meta
      name="description"
      content="hunixcode — full-stack developer and cybersecurity enthusiast. Open-source projects, thoughts on AI-driven development, and a way to get in touch."
    />
    <meta name="theme-color" content="#0c0819" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="hunixcode — full-stack developer" />
    <meta
      property="og:description"
      content="full-stack developer, cybersecurity enthusiast."
    />
    <meta property="og:image" content="https://github.com/hunixcode.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Only the weights actually used are requested (Bricolage Grotesque
      500-700 for display, Geist 400-600 for body, Geist Mono 400), so the
      swap window stays short and the big headlines don't reflow.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <!-- Same ink as the loader curtain, so nothing flashes white before React mounts. -->
    <style>
      #root:empty {
        position: fixed;
        inset: 0;
        background: #0c0819;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
